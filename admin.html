       <thead><tr><th>التاريخ</th><th>زيارات</th><th>طلبات واتساب</th></tr></thead>
          <tbody id="analyticsTbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Settings -->
    <section id="tab-settings" style="display:none">
      <div class="topbar"><div><h2>الإعدادات</h2><div class="sub">إعدادات عامة للمطعم والموقع</div></div></div>
      <div class="panel" style="max-width:560px">
        <div class="field"><label>اسم المطعم</label><input id="setName"></div>
        <div class="field"><label>رقم الواتساب (مع رمز الدولة، بدون +)</label><input id="setWhatsapp" placeholder="9627xxxxxxxx"></div>
        <div class="form-row">
          <div class="field"><label>حد الخصم (أقل مبلغ)</label><input id="setDiscountThreshold" type="number"></div>
          <div class="field"><label>قيمة الخصم</label><input id="setDiscountAmount" type="number"></div>
        </div>
        <div class="field">
          <label>شعار المطعم</label>
          <div class="img-upload" id="logoUpload">
            <div id="logoPreviewWrap">اضغط لرفع شعار</div>
            <input type="file" accept="image/*" onchange="uploadLogo(event)">
          </div>
        </div>
        <button class="btn btn-primary" onclick="saveSettings()">حفظ الإعدادات</button>
      </div>
    </section>
  </main>
</div>

<!-- ===================== PRODUCT MODAL ===================== -->
<div class="overlay" id="productModalOverlay">
  <div class="modal">
    <h3 id="productModalTitle">منتج جديد</h3>
    <input type="hidden" id="prodId">
    <div class="field">
      <label>صورة المنتج</label>
      <div class="img-upload" id="prodImgUpload">
        <div id="prodImgPreviewWrap">اضغط لرفع صورة</div>
        <input type="file" accept="image/*" onchange="uploadProductImage(event)">
      </div>
    </div>
    <div class="form-row">
      <div class="field"><label>اسم المنتج</label><input id="prodName"></div>
      <div class="field"><label>القسم</label><select id="prodCategory"></select></div>
    </div>
    <div class="field"><label>الوصف</label><textarea id="prodDesc"></textarea></div>
    <div class="form-row">
      <div class="field"><label>السعر (د.أ)</label><input id="prodPrice" type="number" step="0.01"></div>
      <div class="field"><label>الأكثر طلبًا؟</label>
        <label class="switch" style="margin-top:8px"><input type="checkbox" id="prodBestseller"><span class="slider"></span></label>
      </div>
    </div>
    <div class="field">
      <label>خيارات الحذف (مثال: بدون خس)</label>
      <input id="removalInput" placeholder="اكتب واضغط Enter" onkeydown="addTag(event,'removals')">
      <div class="tag-list" id="removalsTags"></div>
    </div>
    <div class="field">
      <label>الإضافات (مثال: جبنة إضافية)</label>
      <input id="addonInput" placeholder="اكتب واضغط Enter" onkeydown="addTag(event,'addons')">
      <div class="tag-list" id="addonsTags"></div>
    </div>
    <div class="toggle-row">
      <span>فعّال (يظهر على الموقع)</span>
      <label class="switch"><input type="checkbox" id="prodActive" checked><span class="slider"></span></label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeProductModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveProduct()">حفظ المنتج</button>
    </div>
  </div>
</div>

<!-- ===================== CATEGORY MODAL ===================== -->
<div class="overlay" id="categoryModalOverlay">
  <div class="modal" style="max-width:420px">
    <h3 id="categoryModalTitle">قسم جديد</h3>
    <input type="hidden" id="catId">
    <div class="field"><label>الأيقونة (إيموجي)</label><input id="catIcon" placeholder="🍔"></div>
    <div class="field"><label>اسم القسم</label><input id="catName" placeholder="البرجر"></div>
    <div class="toggle-row">
      <span>فعّال</span>
      <label class="switch"><input type="checkbox" id="catActive" checked><span class="slider"></span></label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeCategoryModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveCategory()">حفظ القسم</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==================== State ==================== */
let API = localStorage.getItem('buns_api_url') || '';
let TOKEN = localStorage.getItem('buns_token') || '';
let DATA = { products: [], categories: [], settings: {}, gallery: [] };
let removalsTemp = [], addonsTemp = [];

/* ==================== Helpers ==================== */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
async function api(path, opts = {}){
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN, ...(opts.headers||{}) }
  });
  if(res.status === 401){ doLogout(); throw new Error('unauthorized'); }
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.message || 'request_failed'); }
  return res.status === 204 ? null : res.json();
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function uploadImageFile(file, folder){
  const base64 = await fileToBase64(file);
  const res = await api('/api/admin/upload', {
    method:'POST',
    body: JSON.stringify({ filename:file.name, dataBase64:base64, contentType:file.type, folder })
  });
  return res.url;
}

/* ==================== Auth ==================== */
async function doLogin(){
  const apiUrl = document.getElementById('apiUrlInput').value.trim().replace(/\/$/,'');
  const pass = document.getElementById('passwordInput').value;
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  if(!apiUrl || !pass){ err.textContent='الرجاء تعبئة الحقلين.'; err.style.display='block'; return; }
  try{
    const res = await fetch(apiUrl + '/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password:pass})
    });
    if(!res.ok) throw new Error();
    const data = await res.json();
    API = apiUrl; TOKEN = data.token;
    localStorage.setItem('buns_api_url', API);
    localStorage.setItem('buns_token', TOKEN);
    bootApp();
  }catch(e){
    err.textContent = 'كلمة المرور غير صحيحة أو تعذّر الاتصال بالـ API.';
    err.style.display='block';
  }
}
function doLogout(){
  localStorage.removeItem('buns_token');
  TOKEN=''; 
  document.getElementById('app').classList.remove('show');
  document.getElementById('loginScreen').style.display='flex';
}

/* ==================== Boot ==================== */
window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('apiUrlInput').value = API || window.location.origin;
  if(API && TOKEN){ bootApp(); }
});

async function bootApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').classList.add('show');
  await loadAll();
  switchTab('dashboard');
}

async function loadAll(){
  const [products, categories, settings, gallery] = await Promise.all([
    api('/api/admin/products'), api('/api/admin/categories'),
    api('/api/admin/settings'), api('/api/admin/gallery')
  ]);
  DATA.products = products; DATA.categories = categories; DATA.settings = settings; DATA.gallery = gallery;
}

/* ==================== Tabs ==================== */
document.getElementById('sideNav').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(btn) switchTab(btn.dataset.tab);
});
function switchTab(tab){
  document.querySelectorAll('#sideNav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('main > section').forEach(s=> s.style.display = (s.id==='tab-'+tab) ? '' : 'none');
  if(tab==='dashboard') renderDashboard();
  if(tab==='products') renderProducts();
  if(tab==='categories') renderCategories();
  if(tab==='gallery') renderGallery();
  if(tab==='analytics') renderAnalytics();
  if(tab==='settings') renderSettings();
}

/* ==================== Dashboard ==================== */
async function renderDashboard(){
  const s = await api('/api/admin/summary');
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="ic">🍔</div><div class="num">${s.productsCount}</div><div class="lbl">عدد المنتجات</div></div>
    <div class="stat-card"><div class="ic">🗂️</div><div class="num">${s.categoriesCount}</div><div class="lbl">عدد الأقسام</div></div>
    <div class="stat-card"><div class="ic">👀</div><div class="num">${s.pageViews}</div><div class="lbl">إجمالي الزيارات</div></div>
    <div class="stat-card"><div class="ic">💬</div><div class="num">${s.whatsappOrders}</div><div class="lbl">طلبات واتساب</div></div>
  `;
}

/* ==================== Products ==================== */
function renderProducts(){
  const filterSel = document.getElementById('productCatFilter');
  filterSel.innerHTML = '<option value="">كل الأقسام</option>' + DATA.categories.map(c=>`<option value="${c.id}">${c.icon} ${c.name_ar}</option>`).join('');
  const search = (document.getElementById('productSearch').value||'').trim();
  const catFilter = filterSel.value;
  let list = DATA.products;
  if(search) list = list.filter(p=> p.ar.name.includes(search));
  if(catFilter) list = list.filter(p=> p.category === catFilter);

  const tbody = document.getElementById('productsTbody');
  document.getElementById('productsEmpty').style.display = list.length ? 'none':'block';
  tbody.innerHTML = list.map(p=>{
    const cat = DATA.categories.find(c=>c.id===p.category);
    return `<tr>
      <td>${p.img ? `<img src="${p.img}">` : '—'}</td>
      <td><b>${p.ar.name||'بدون اسم'}</b>${p.bestseller?' 🔥':''}</td>
      <td>${cat ? cat.icon+' '+cat.name_ar : '—'}</td>
      <td>${Number(p.price).toFixed(2)} د.أ</td>
      <td><span class="badge ${p.active?'badge-ok':'badge-off'}">${p.active?'فعّال':'مخفي'}</span></td>
      <td><div class="row-actions">
        <button class="icon-btn" onclick="openProductModal('${p.id}')">تعديل</button>
        <button class="icon-btn danger" onclick="deleteProduct('${p.id}')">حذف</button>
      </div></td>
    </tr>`;
  }).join('');
}

function openProductModal(id){
  document.getElementById('productModalOverlay').classList.add('show');
  const catSel = document.getElementById('prodCategory');
  catSel.innerHTML = DATA.categories.map(c=>`<option value="${c.id}">${c.icon} ${c.name_ar}</option>`).join('');
  removalsTemp = []; addonsTemp = [];
  if(id){
    const p = DATA.products.find(x=>x.id===id);
    document.getElementById('productModalTitle').textContent = 'تعديل منتج';
    document.getElementById('prodId').value = p.id;
    document.getElementById('prodName').value = p.ar.name;
    document.getElementById('prodDesc').value = p.ar.desc;
    document.getElementById('prodPrice').value = p.price;
    document.getElementById('prodCategory').value = p.category;
    document.getElementById('prodBestseller').checked = !!p.bestseller;
    document.getElementById('prodActive').checked = p.active !== false;
    document.getElementById('prodImgPreviewWrap').innerHTML = p.img ? `<img src="${p.img}">` : 'اضغط لرفع صورة';
    document.getElementById('prodImgPreviewWrap').dataset.url = p.img || '';
    removalsTemp = [...(p.ar.removals||[])];
    addonsTemp = [...(p.ar.addons||[])];
  } else {
    document.getElementById('productModalTitle').textContent = 'منتج جديد';
    document.getElementById('prodId').value = '';
    document.getElementById('prodName').value = '';
    document.getElementById('prodDesc').value = '';
    document.getElementById('prodPrice').value = '';
    document.getElementById('prodBestseller').checked = false;
    document.getElementById('prodActive').checked = true;
    document.getElementById('prodImgPreviewWrap').innerHTML = 'اضغط لرفع صورة';
    document.getElementById('prodImgPreviewWrap').dataset.url = '';
  }
  renderTags();
}
function closeProductModal(){ document.getElementById('productModalOverlay').classList.remove('show'); }

async function uploadProductImage(e){
  const file = e.target.files[0]; if(!file) return;
  toast('جاري رفع الصورة...');
  try{
    const url = await uploadImageFile(file, 'products');
    document.getElementById('prodImgPreviewWrap').innerHTML = `<img src="${url}">`;
    document.getElementById('prodImgPreviewWrap').dataset.url = url;
    toast('تم رفع الصورة ✅');
  }catch(err){ toast('فشل رفع الصورة'); }
}

function addTag(e, type){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  const input = e.target;
  const val = input.value.trim();
  if(!val) return;
  if(type==='removals') removalsTemp.push(val); else addonsTemp.push(val);
  input.value = '';
  renderTags();
}
function removeTag(type, idx){
  if(type==='removals') removalsTemp.splice(idx,1); else addonsTemp.splice(idx,1);
  renderTags();
}
function renderTags(){
  document.getElementById('removalsTags').innerHTML = removalsTemp.map((t,i)=>`<span class="tag">${t}<button onclick="removeTag('removals',${i})">✕</button></span>`).join('');
  document.getElementById('addonsTags').innerHTML = addonsTemp.map((t,i)=>`<span class="tag">${t}<button onclick="removeTag('addons',${i})">✕</button></span>`).join('');
}

async function saveProduct(){
  const id = document.getElementById('prodId').value;
  const payload = {
    category: document.getElementById('prodCategory').value,
    price: parseFloat(document.getElementById('prodPrice').value) || 0,
    img: document.getElementById('prodImgPreviewWrap').dataset.url || '',
    bestseller: document.getElementById('prodBestseller').checked,
    active: document.getElementById('prodActive').checked,
    ar: {
      name: document.getElementById('prodName').value.trim(),
      desc: document.getElementById('prodDesc').value.trim(),
      removals: removalsTemp,
      addons: addonsTemp
    }
  };
  if(!payload.ar.name){ toast('الرجاء إدخال اسم المنتج'); return; }
  try{
    if(id){ await api('/api/admin/products/'+id, {method:'PUT', body:JSON.stringify(payload)}); }
    else{ await api('/api/admin/products', {method:'POST', body:JSON.stringify(payload)}); }
    await loadAll(); renderProducts(); closeProductModal();
    toast('تم حفظ المنتج ✅');
  }catch(e){ toast('حدث خطأ أثناء الحفظ'); }
}
async function deleteProduct(id){
  if(!confirm('متأكد إنك بدك تحذف هذا المنتج؟')) return;
  await api('/api/admin/products/'+id, {method:'DELETE'});
  await loadAll(); renderProducts();
  toast('تم الحذف');
}

/* ==================== Categories ==================== */
function renderCategories(){
  const tbody = document.getElementById('categoriesTbody');
  tbody.innerHTML = DATA.categories.map(c=>`
    <tr>
      <td style="font-size:20px">${c.icon}</td>
      <td><b>${c.name_ar}</b></td>
      <td><span class="badge ${c.active?'badge-ok':'badge-off'}">${c.active?'فعّال':'مخفي'}</span></td>
      <td><div class="row-actions">
        <button class="icon-btn" onclick="openCategoryModal('${c.id}')">تعديل</button>
        <button class="icon-btn danger" onclick="deleteCategory('${c.id}')">حذف</button>
      </div></td>
    </tr>
  `).join('');
}
function openCategoryModal(id){
  document.getElementById('categoryModalOverlay').classList.add('show');
  if(id){
    const c = DATA.categories.find(x=>x.id===id);
    document.getElementById('categoryModalTitle').textContent = 'تعديل قسم';
    document.getElementById('catId').value = c.id;
    document.getElementById('catIcon').value = c.icon;
    document.getElementById('catName').value = c.name_ar;
    document.getElementById('catActive').checked = c.active !== false;
  } else {
    document.getElementById('categoryModalTitle').textContent = 'قسم جديد';
    document.getElementById('catId').value = '';
    document.getElementById('catIcon').value = '';
    document.getElementById('catName').value = '';
    document.getElementById('catActive').checked = true;
  }
}
function closeCategoryModal(){ document.getElementById('categoryModalOverlay').classList.remove('show'); }
async function saveCategory(){
  const id = document.getElementById('catId').value;
  const payload = {
    icon: document.getElementById('catIcon').value.trim() || '🍽️',
    name_ar: document.getElementById('catName').value.trim(),
    active: document.getElementById('catActive').checked
  };
  if(!payload.name_ar){ toast('الرجاء إدخال اسم القسم'); return; }
  if(id){ await api('/api/admin/categories/'+id, {method:'PUT', body:JSON.stringify(payload)}); }
  else{ await api('/api/admin/categories', {method:'POST', body:JSON.stringify(payload)}); }
  await loadAll(); renderCategories(); closeCategoryModal();
  toast('تم الحفظ ✅');
}
async function deleteCategory(id){
  if(!confirm('حذف القسم بيأثر على المنتجات المرتبطة فيه. متأكد؟')) return;
  await api('/api/admin/categories/'+id, {method:'DELETE'});
  await loadAll(); renderCategories();
  toast('تم الحذف');
}

/* ==================== Gallery ==================== */
function renderGallery(){
  const grid = document.getElementById('galleryGrid');
  document.getElementById('galleryEmpty').style.display = DATA.gallery.length ? 'none':'block';
  grid.innerHTML = DATA.gallery.map(g=>`
    <div class="gallery-item">
      <img src="${g.url}">
      <button onclick="deleteGalleryItem('${g.id}')">حذف</button>
    </div>
  `).join('');
}
async function uploadGalleryImage(e){
  const file = e.target.files[0]; if(!file) return;
  toast('جاري رفع الصورة...');
  try{
    const url = await uploadImageFile(file, 'gallery');
    await api('/api/admin/gallery', {method:'POST', body:JSON.stringify({url})});
    await loadAll(); renderGallery();
    toast('تمت الإضافة ✅');
  }catch(err){ toast('فشل رفع الصورة'); }
}
async function deleteGalleryItem(id){
  if(!confirm('حذف هذه الصورة؟')) return;
  await api('/api/admin/gallery/'+id, {method:'DELETE'});
  await loadAll(); renderGallery();
}

/* ==================== QR ==================== */
function generateQR(){
  const url = document.getElementById('qrUrlInput').value.trim();
  if(!url){ toast('ادخل رابط الموقع أولًا'); return; }
  const qrImg = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=' + encodeURIComponent(url);
  document.getElementById('qrPreview').innerHTML = `
    <img src="${qrImg}" alt="QR">
    <div style="margin-top:12px"><a class="btn btn-ghost btn-sm" href="${qrImg}" download="15buns-qr.png">⬇️ تحميل QR</a></div>
  `;
}

/* ==================== Analytics ==================== */
async function renderAnalytics(){
  const a = await api('/api/admin/analytics');
  document.getElementById('analyticsGrid').innerHTML = `
    <div class="stat-card"><div class="ic">👀</div><div class="num">${a.pageViews}</div><div class="lbl">إجمالي الزيارات</div></div>
    <div class="stat-card"><div class="ic">💬</div><div class="num">${a.whatsappOrders}</div><div class="lbl">إجمالي طلبات واتساب</div></div>
  `;
  const days = Object.keys(a.daily||{}).sort().reverse().slice(0,14);
  document.getElementById('analyticsTbody').innerHTML = days.length ? days.map(d=>`
    <tr><td>${d}</td><td>${a.daily[d].pageViews||0}</td><td>${a.daily[d].whatsappOrders||0}</td></tr>
  `).join('') : '<tr><td colspan="3" style="text-align:center;color:#999">لا توجد بيانات بعد</td></tr>';
}

/* ==================== Settings ==================== */
function renderSettings(){
  const s = DATA.settings;
  document.getElementById('setName').value = s.restaurantName || '';
  document.getElementById('setWhatsapp').value = s.whatsapp || '';
  document.getElementById('setDiscountThreshold').value = s.discountThreshold ?? '';
  document.getElementById('setDiscountAmount').value = s.discountAmount ?? '';
  document.getElementById('logoPreviewWrap').innerHTML = s.logo ? `<img src="${s.logo}" style="max-height:70px">` : 'اضغط لرفع شعار';
  document.getElementById('logoPreviewWrap').dataset.url = s.logo || '';
}
async function uploadLogo(e){
  const file = e.target.files[0]; if(!file) return;
  toast('جاري رفع الشعار...');
  try{
    const url = await uploadImageFile(file, 'branding');
    document.getElementById('logoPreviewWrap').innerHTML = `<img src="${url}" style="max-height:70px">`;
    document.getElementById('logoPreviewWrap').dataset.url = url;
    toast('تم رفع الشعار ✅');
  }catch(err){ toast('فشل الرفع'); }
}
async function saveSettings(){
  const payload = {
    restaurantName: document.getElementById('setName').value.trim(),
    whatsapp: document.getElementById('setWhatsapp').value.trim(),
    discountThreshold: parseFloat(document.getElementById('setDiscountThreshold').value) || 0,
    discountAmount: parseFloat(document.getElementById('setDiscountAmount').value) || 0,
    logo: document.getElementById('logoPreviewWrap').dataset.url || ''
  };
  DATA.settings = await api('/api/admin/settings', {method:'PUT', body:JSON.stringify(payload)});
  toast('تم حفظ الإعدادات ✅');
}
</script>
</body>
</html
